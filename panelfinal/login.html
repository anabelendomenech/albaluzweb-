<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Entrar · ALBALUZ</title>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:wght@500;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>
<div style="min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px">
  <div style="background:#fff;border-radius:var(--radius);box-shadow:var(--shadow);padding:34px 30px;width:100%;max-width:380px">
    <div style="text-align:center;margin-bottom:26px">
      <div class="brand" style="font-size:1.7rem;color:var(--wine)">👗 ALBALUZ</div>
      <p class="hint" style="margin:6px 0 0">Panel de gestión</p>
    </div>

    <form id="form">
      <div class="field">
        <label>Usuario</label>
        <input id="usuario" autocomplete="username" required autofocus>
      </div>
      <div class="field">
        <label>Contraseña</label>
        <input type="password" id="password" autocomplete="current-password" required>
      </div>
      <div id="error" style="display:none;color:var(--warn);font-size:.85rem;font-weight:600;margin-bottom:12px"></div>
      <button type="submit" class="btn gold" style="width:100%">Entrar</button>
      <p class="hint" style="text-align:center;margin:14px 0 0">Esta compu queda con la sesión iniciada.</p>
    </form>
  </div>
</div>

<script src="common.js"></script>
<script>
// Si ya hay sesión, no tiene sentido mostrar el login.
if (getToken()) location.replace('index.html');

const form = document.getElementById('form');
const cajaError = document.getElementById('error');

function mostrarError(msg) {
  cajaError.textContent = msg;
  cajaError.style.display = 'block';
}

form.addEventListener('submit', async (e) => {
  e.preventDefault();
  cajaError.style.display = 'none';
  const btn = form.querySelector('button[type=submit]');
  btn.disabled = true; btn.textContent = 'Entrando…';
  try {
    const res = await apiPost('login', {
      usuario: document.getElementById('usuario').value,
      password: document.getElementById('password').value
    });
    if (res && res.token) {
      setToken(res.token);
      location.replace('index.html');
      return;
    }
    mostrarError((res && res.error) || 'No se pudo entrar. Intentá de nuevo.');
  } catch (err) {
    mostrarError('No se pudo conectar. Revisá tu internet.');
    console.error(err);
  } finally {
    btn.disabled = false; btn.textContent = 'Entrar';
  }
});
</script>
</body>
</html>
